<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sydney Half Training Log</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Half Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Clean Blush: white ground, #F34974 pink, deep plum ink. Home = greeting, big countdown, tinted today card, stats, circle calendar. Day = plain top bar, left-aligned plan header, lined checklists, tinted nutrition card. */
:root{
  --bg:#ffffff; --pink:#F34974; --pink-ink:#d42c5a; --plum:#3b1220; --muted:#7a5562;
  --tint:#fdeef2; --tint-2:#f9dbe4; --track:#f6d3dd; --line:#f3e3e9;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior-y:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--plum);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;pointer-events:none}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:var(--font);color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.screen{max-width:560px;margin:0 auto;padding-inline:22px;padding-block:24px 56px;display:flex;flex-direction:column;gap:26px}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.greet{display:flex;flex-direction:column;gap:2px}
.hello{font-size:15px;color:var(--muted)}
.todayline{font-weight:800;font-size:22px}
.count{display:flex;align-items:center;gap:18px}
.big{font-weight:800;font-size:112px;line-height:.85;color:var(--pink);letter-spacing:-.02em}
.countside{display:flex;flex-direction:column;gap:8px;min-width:0}
#hCountLbl{font-size:17px;line-height:1.25;max-width:6.4em}
.meta{font-size:13px;color:var(--muted)}

.todaycard{background:var(--tint);border:0;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;width:100%;color:var(--plum)}
.todaycard .eyebrow{font-size:13px;font-weight:600;color:var(--pink-ink)}
.todaycard h3{margin:0;font-weight:800;font-size:28px;line-height:1.1}
.todaycard p{margin:0;font-size:15px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .35s}
.open{align-self:flex-start;background:var(--plum);color:#fff;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stat{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .num{font-weight:800;font-size:28px;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted)}

.cal{display:flex;flex-direction:column;gap:12px}
.cal-head{display:flex;justify-content:space-between;align-items:baseline}
.cal-head h2{margin:0;font-weight:800;font-size:19px}
.cal-head span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.wk{display:none}
.cell{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:50%;background:var(--tint);color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;min-width:0;transition:transform .12s}
.cell:active{transform:scale(.94)}
.cell .m{display:none}
.cell .lab{display:block;font-size:8.5px;font-weight:600;line-height:1;color:var(--muted);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.cell.run .lab{color:var(--pink-ink)}
.cell.complete .lab,.cell.race .lab{color:#fff}
.cell.today .lab{color:var(--plum)}
.cell .d{font-weight:700;font-size:15px;line-height:1}
.cell.key{background:var(--tint-2)}
.cell.past:not(.complete){opacity:.55}
.cell.today{background:#fff;box-shadow:inset 0 0 0 2px var(--plum);opacity:1}
.cell.complete{background:var(--pink);color:#fff;opacity:1}
.cell.race{background:var(--plum);color:#fff}
.cell.race .d::after{content:"";}
.cell.empty{visibility:hidden}
.cell .ring{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p)*1%),var(--track) 0);box-shadow:0 0 0 2px #fff}
.cell.complete .ring{display:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lg-done{background:var(--pink)}
.legend .lg-today{box-shadow:inset 0 0 0 2px var(--plum)}
.legend .lg-key{background:var(--tint-2)}
.sync{font-size:12px;color:var(--muted);text-align:center}

/* ---------- day ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-22px;padding:12px 22px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}
.topbar #back{grid-column:1;justify-self:start}
.topbar .t{grid-column:2;font-weight:600;white-space:nowrap}
.topbar #todayBtn{grid-column:3;justify-self:end}
.iconbtn{border:0;background:none;color:var(--plum);font-weight:600;font-size:15px;padding:6px 0;cursor:pointer}
#todayBtn{background:var(--tint);color:var(--pink-ink);border-radius:999px;padding:6px 14px}
.dayhero{display:flex;flex-direction:column;gap:8px}
.ddate{display:none}
.kick{font-size:14px;font-weight:600;color:var(--pink-ink)}
.dayhero h1{margin:0;font-weight:800;font-size:46px;line-height:1}
.dsub{font-size:17px;color:var(--muted)}
.dsub:empty{display:none}
.dayhero .prog{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--muted)}
.chip.acc{background:var(--pink);color:#fff}
.chip.ok{background:var(--plum);color:#fff}
.note{background:var(--tint);border-radius:16px;padding:12px 14px;font-size:15px}

.sec{display:flex;flex-direction:column}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:4px}
.sec-h h2{margin:0;font-weight:800;font-size:19px}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;color:var(--plum)}
.box{width:24px;height:24px;border-radius:50%;border:2px solid #e5a9ba;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;margin-top:1px}
.task[aria-checked="true"] .box{background:var(--pink);border-color:var(--pink)}
.task[aria-checked="true"] .box::after{content:"";width:10px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task .tt{font-weight:600;font-size:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.task[aria-checked="true"] .tt span:not(.time){text-decoration:line-through;color:var(--muted)}
.task .time{font-size:12px;font-weight:600;color:var(--pink-ink)}
.task .dd{font-size:14px;color:var(--muted);margin-top:2px}
.task ul{margin:6px 0 0;padding-left:16px;font-size:14px;color:var(--muted)}
.task ul li{margin:1px 0}
.log{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px}
.log label,.notes label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.log .pace{grid-column:1/-1;font-size:13px;color:var(--muted)}
.log .pace b{color:var(--plum);font-variant-numeric:tabular-nums}
input,textarea{font:16px var(--font);color:var(--plum);background:var(--tint);border:2px solid transparent;border-radius:12px;padding:10px 11px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
textarea{min-height:80px;resize:vertical}
.notes{padding-top:6px}

#secFood{background:var(--tint);border-radius:22px;padding:18px}
#secFood .sec-h{padding-bottom:8px}
.fgroup{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.fgroup h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.fitem{display:flex;flex-direction:column;gap:2px}
.fitem .when{align-self:flex-start;font-size:12px;font-weight:600;color:var(--pink-ink);background:#fff;border-radius:999px;padding:2px 10px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.fitem .ft{font-weight:600}
.fitem .fd{font-size:14px;color:var(--muted)}
.tips{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mealsbox{background:#fff;border-radius:14px;padding:0 14px}
.mealsbox summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--plum);padding:13px 0}
.mealsbox summary::-webkit-details-marker{display:none}
.mealsbox summary .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.mealsbox summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
.mealsbox[open] summary::after{transform:rotate(45deg)}
.mealsbox[open]{padding-bottom:12px}
.mealsbox .fitem+.fitem{margin-top:10px}

.daynav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daynav .iconbtn{border-radius:999px;padding:13px;text-align:center;justify-content:center;display:flex}
#prevDay{background:var(--tint)}
#nextDay{background:var(--plum);color:#fff}
.daynav .iconbtn:disabled{opacity:.35;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--plum);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 8px 28px rgba(59,18,32,.25);transition:transform .3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast{visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* page transitions */
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px)}}
.screen.enter{animation:pageIn .32s ease-out both}
.screen.leaving{animation:pageOut .22s ease-in both;pointer-events:none}
@media (prefers-reduced-motion:reduce){.screen.enter,.screen.leaving{animation:none}*{transition:none!important}}
@media (max-width:370px){.big{font-size:92px}.dayhero h1{font-size:38px}.cell .d{font-size:13px}.cell .lab{font-size:7.5px}.grid{gap:5px}}
</style>
</head>
<body>
<!-- HOME -->
<div class="screen" id="home">
  <header class="hero">
    <div class="greet"><span class="hello" id="hello">Hello Emily</span><span class="todayline" id="hToday"></span></div>
    <div class="count"><span class="big num" id="hCount">–</span><div class="countside"><span id="hCountLbl">days until Sydney Half</span><span class="meta">Sun 1 Nov · 13.1 mi</span></div></div>
  </header>

  <button type="button" class="todaycard" id="todayCard">
    <span class="eyebrow" id="tcEyebrow">Today's plan</span>
    <h3 id="tcTitle">–</h3>
    <p id="tcSub"></p>
    <div class="prog"><div class="bar"><i id="tcBar"></i></div><span id="tcProg">0 of 0</span></div>
    <span class="open">Open today</span>
  </button>

  <section class="stats" aria-label="Progress">
    <div class="stat"><div class="num" id="sDays">0</div><div class="lbl">Days complete</div></div>
    <div class="stat"><div class="num" id="sMiles">0</div><div class="lbl">Miles run</div></div>
    <div class="stat"><div class="num" id="sStreak">0</div><div class="lbl">Day streak</div></div>
  </section>

  <section class="cal" aria-label="Training calendar">
    <div class="cal-head"><h2>Training block</h2><span>Oct 11 – Nov 1</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="lg-done"></i>Complete</span>
      <span><i class="lg-today"></i>Today</span>
      <span><i class="lg-key"></i>Key session</span>
    </div>
  </section>
  <div class="sync" id="sync">Saved on this phone</div>
</div>

<!-- DAY -->
<div class="screen" id="day" hidden>
  <div class="topbar">
    <button type="button" class="iconbtn" id="back" aria-label="Back to calendar">‹ Calendar</button>
    <div class="t" id="dBarTitle"></div>
    <button type="button" class="iconbtn" id="todayBtn">Today</button>
  </div>
  <div class="dayhero">
    <div class="chips" id="dChips"></div>
    <div class="ddate" id="dDate"></div><div class="kick" id="dKick">Today's plan</div><h1 id="dTitle"></h1><div class="dsub num" id="dSub"></div>
    <div class="prog"><div class="bar"><i id="dBar"></i></div><span id="dProg"></span></div>
  </div>
  <div class="note" id="dNote" hidden></div>
  <section class="sec" id="secRun"><div class="sec-h"><h2>Run</h2><span data-count></span></div><div data-list></div>
    <div class="log" id="runLog">
      <label for="logMiles">Actual miles<input id="logMiles" inputmode="decimal" placeholder="0"></label>
      <label for="logTime">Time (h:mm:ss)<input id="logTime" inputmode="numeric" placeholder="e.g. 48:30"></label>
      <div class="pace" id="logPace"></div>
    </div>
  </section>
  <section class="sec" id="secTrain"><div class="sec-h"><h2>Training &amp; mobility</h2><span data-count></span></div><div data-list></div></section>
  <section class="sec" id="secFood"><div class="sec-h"><h2>Nutrition</h2><span>Suggestions</span></div><div data-list></div></section>
  <section class="sec"><div class="sec-h"><h2>Notes</h2></div>
    <div class="notes"><label for="dayNotes">How it went<textarea id="dayNotes" placeholder="Energy, aches, weather, what you ate instead…"></textarea></label></div>
  </section>
  <div class="daynav"><button type="button" class="iconbtn" id="prevDay">‹ Previous day</button><button type="button" class="iconbtn" id="nextDay">Next day ›</button></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- building blocks ---------- */
const WU={t:"Warm-up · 5 min",d:"Brisk walk 2 min, leg swings 10 each leg, 10 walking lunges, high knees + butt kicks 20 m, ankle circles."};
const ST={t:"Post-run stretch · 10 min",d:"Calves, hamstrings, quads, hip flexors, glutes. Hold 30–45 s each side."};
const SA={t:"Strength A · 35 min",d:"3 sets each, 60–90 s rest. Weights you could lift 2–3 more reps with.",l:["Goblet squat × 10","Romanian deadlift × 10","Reverse lunge × 8 each leg","Calf raise on a step × 15 (3 s down)","Glute bridge × 12 (2 s hold)","Plank 40 s"]};
const SB={t:"Strength B · 35 min",d:"3 sets each, 60–90 s rest.",l:["Step-up × 8 each leg","Single-leg Romanian deadlift × 8 each leg","Single-leg calf raise × 12 each leg","Lateral band walk × 12 each way","Side plank 30 s each side","Dead bug × 8 each side"]};
const SB2={...SB,t:"Strength B (lighter) · 25 min",d:"2 sets only this week."};
const SL={t:"Light strength · 15 min",d:"Bodyweight, 2 rounds. Last strength session before the race.",l:["10 squats","10 glute bridges","15 calf raises","30 s plank","20 s side plank each side"]};
const MOB={t:"Hip mobility · 10 min",d:"90/90 switches × 10, world's greatest stretch × 5 each side, cat-cow × 10, clamshells × 15 each side."};
const FR={t:"Foam roll · 10 min",d:"Calves, quads, glutes. Roll the outer quad, not the IT band."};
const W=n=>({t:`Walk · ${n} min`,d:"Easy, relaxed pace."});

/* ---------- nutrition guidance (portions for 70 kg) ---------- */
const MEALS=[
 {t:"Oat bowl",d:"80 g oats cooked in water, 1 banana, 125 g frozen raspberries, 1 tbsp honey, 2 tbsp peanut butter powder, 170 g Greek yogurt."},
 {t:"Chicken & sweet potato bowl",d:"130 g extra lean ground chicken (raw weight), 250 g roasted sweet potato, 1 cup cooked white rice, ½ avocado, 1 cup spinach."},
 {t:"Chicken & rice",d:"130 g ground chicken, 1½ cups cooked white rice, 1 cup vegetables, ¼ avocado, salted."},
 {t:"Egg & sweet potato scramble",d:"3 eggs, 200 g diced roasted sweet potato, a handful of spinach, ¼ avocado."},
 {t:"Sushi (eating out)",d:"2 rolls: salmon, tuna, chicken, egg or avocado. Skip tempura and mayo-heavy rolls. Add miso soup on hot days."},
 {t:"Yogurt bowl (snack)",d:"170 g Greek yogurt, 1 tbsp honey, raspberries or a sliced apple or pear."},
 {t:"Fruit & PB dip (snack)",d:"1 apple or pear with 2 tbsp peanut butter powder mixed with water."},
 {t:"Smoothie (eating out)",d:"Any fruit and yogurt smoothie. Great after a hard or long run."}];
const WATER="Water: 2–3 litres across the day, plus 500–750 ml per hour of running.";
function mealsTrain(o={}){return {
 pre:o.hard?[
   {w:"60–90 min before",t:"Banana + honey",d:"1 banana and 1 tbsp honey, about 45 g carbs. The best fuel for a harder session."},
   {w:"2–3 hrs before",t:"A normal meal is fine",d:"Keep it low in fat and fibre: oats or a rice dish, go easy on avocado."}]
  :[{w:"30–60 min before",t:"Banana",d:"Half to a whole banana. Running first thing and for under an hour? Water alone is fine."},
   {w:"1–2 hrs before",t:"Small oat bowl",d:"40 g oats in water with ½ banana and 1 tsp honey, if you want something more filling."}],
 post:[{w:"Within 60 min after",t:o.hard?"Yogurt, banana & honey or a smoothie":"Yogurt & fruit, or your next meal",d:o.hard?"170 g Greek yogurt, 1 banana, 1 tbsp honey (about 50 g carbs, 17 g protein), or buy a fruit and yogurt smoothie.":"170 g Greek yogurt with a piece of fruit. If a meal is coming within the hour, just eat that."}],
 meals:MEALS,
 tips:["Training day: aim for about 400 g carbs and 115 g protein in total. Put rice or sweet potato in at least two meals.",WATER]}}
function mealsRest(o={}){return {pre:[],post:[],meals:MEALS,
 tips:[o.extra?"Rest from running, but eat normal-to-generous carbs today: add rice or sweet potato to two meals. Tomorrow is a long run.":"Rest day: about 300 g carbs. Use smaller rice and sweet potato portions than on run days; keep protein the same.",WATER]}}
function mealsLong(fuel){return {
 pre:[{w:"2½–3 hrs before",t:"Race-rehearsal breakfast",d:"60 g oats cooked in water, 1 banana, 2 tbsp honey, 250 ml coconut water + 500 ml water. Exactly what you'll eat on race morning."},
      {w:"Last 30 min",t:"Sips only",d:"A few mouthfuls of water. Nothing new."}],
 during:[{w:"From 40 min in",t:"Mid-run fuel",d:fuel}],
 post:[{w:"Within 30–60 min after",t:"Recovery smoothie",d:"170 g Greek yogurt, 1 banana, 125 g raspberries, 40 g oats, 1 tbsp honey, 300 ml coconut water (about 105 g carbs, 22 g protein). Or buy one."}],
 meals:MEALS,
 tips:["Biggest eating day of the week: about 480 g carbs. Add an extra serve of rice or sweet potato to your meals.","Add a pinch of salt to your bottle on hot runs.",WATER]}}
function mealsCarb(sat){return {
 pre:sat?[{w:"30 min before",t:"Optional banana",d:"Only if you're hungry before the shakeout."}]:[],
 post:[],
 meals:[
  {t:"Big oat bowl",d:"100 g oats cooked in water, 2 bananas, 2 tbsp honey, 170 g Greek yogurt."},
  {t:"Rice bowl",d:"2 cups (320 g) cooked white rice, 200 g peeled roasted sweet potato, 100 g ground chicken, salted."},
  {t:"Chicken, rice & sweet potato",d:"2 cups cooked white rice, 120 g ground chicken, 150 g peeled sweet potato."},
  {t:"Sushi (eating out)",d:"3 rolls with cooked fillings: teriyaki chicken, cooked tuna, egg, cucumber."+(sat?" No raw fish tonight.":"")},
  {t:"Banana, honey & coconut water (snack)",d:"1 banana with 1 tbsp honey and 500 ml coconut water."},
  {t:"Warm honey oats or rice (snack)",d:"50 g oats or 1 cup cooked rice warmed with 1 tbsp honey."}],
 tips:["Carb load: about 600 g carbs today. Eat carbs at every meal and snack.","Low fibre and fat: skip raspberries and fruit skins, go light on avocado and nut butter.",sat?"Eat your last big meal early this evening and keep it familiar.":"Expect the scale to go up 1–2 kg. That's stored fuel and water.","Water 2–3 litres and salt your food."]}}
const mealsRace={
 pre:[{w:"3 hrs before start",t:"Race breakfast",d:"60 g oats cooked in water, 1 banana, 2 tbsp honey, 250 ml coconut water + 400–500 ml water."},
      {w:"2 hrs before",t:"Last drink",d:"Sip 250 ml water or electrolyte drink, then stop."},
      {w:"10 min before",t:"Optional gel",d:"With a few sips of water."}],
 during:[{w:"~40 min (mile 4)",t:"Fuel 1",d:"Gel or 1½ tbsp honey + water at the aid station."},
         {w:"~75 min (mile 8)",t:"Fuel 2",d:"Gel or 1½ tbsp honey + water."},
         {w:"~105 min (mile 11)",t:"Optional fuel 3",d:"Only if you feel flat."},
         {w:"Every aid station",t:"Water",d:"150–250 ml. Walking through to drink is fine."}],
 post:[{w:"Within 60 min after",t:"Rehydrate & refuel",d:"500 ml fluid with electrolytes, then a recovery smoothie."}],
 meals:[{t:"Celebration meal",d:"Sushi, a rice bowl, whatever you like. You've earned it."}],
 tips:["Nothing new today: only foods you tested on 18 and 25 October."]};

/* ---------- the plan ---------- */
const P=[
 {iso:"2026-10-11",type:"Rest",cal:"Rest",title:"Rest & reset",run:null,train:[W(30),{t:"Stretch routine · 10 min",d:ST.d}],food:mealsTrain()},
 {iso:"2026-10-12",type:"Easy",cal:"3 mi",mi:3,title:"Easy 3 + Strength A",run:{t:"Easy run · 3 mi",d:"9:45–10:30 /mi. Conversational."},train:[SA],food:mealsTrain()},
 {iso:"2026-10-13",type:"Easy",cal:"5 mi",mi:5,title:"Easy 5 + strides",run:{t:"Easy run · 5 mi",d:"9:45–10:30 /mi, then 4 × 20 s strides: quick and relaxed, walk back between."},train:[],food:mealsTrain()},
 {iso:"2026-10-14",type:"Tempo",key:1,cal:"Tempo 6",mi:6,title:"Tempo 6",run:{t:"Tempo run · 6 mi",d:"1.5 mi easy · 3 mi at 8:30–8:40 /mi · 1.5 mi easy."},train:[],food:mealsTrain({hard:1})},
 {iso:"2026-10-15",type:"Strength",cal:"Rest",title:"Strength B + walk",run:null,train:[SB,W(30)],food:mealsRest()},
 {iso:"2026-10-16",type:"Easy",cal:"3 mi",mi:3,title:"Easy 3",run:{t:"Easy run · 3 mi",d:"9:45–10:30 /mi."},train:[MOB],food:mealsTrain(),note:"Have a little extra rice at dinner — long run on Sunday."},
 {iso:"2026-10-17",type:"Rest",cal:"Rest",title:"Rest day",run:null,train:[W(25),FR],food:mealsRest({extra:1}),note:"Rest from running, but keep carbs normal ahead of tomorrow's long run. Buy your gels or prep honey portions."},
 {iso:"2026-10-18",type:"Long run",key:1,cal:"Long 8",mi:8,title:"Long run 8",run:{t:"Long run · 8 mi",d:"Easy at 9:45–10:30 /mi; last 2 mi at goal pace 9:20–9:30. Walk 10 min after."},train:[],food:mealsLong("1 gel or 1½ tbsp honey at 40 min, with 150–250 ml water."),note:"First fuelling test: practise the race breakfast and mid-run fuel."},
 {iso:"2026-10-19",type:"Strength",cal:"Rest",title:"Strength A + walk",run:null,train:[SA,W(30)],food:mealsRest()},
 {iso:"2026-10-20",type:"Easy",cal:"5 mi",mi:5,title:"Easy 5 + strides",run:{t:"Easy run · 5 mi",d:"9:45–10:30 /mi, then 6 × 20 s strides."},train:[],food:mealsTrain()},
 {iso:"2026-10-21",type:"Goal pace",key:1,cal:"GP 7",mi:7,title:"Goal-pace 7",run:{t:"Goal-pace run · 7 mi",d:"1.5 mi easy · 2 × 2 mi at 9:20–9:30 /mi with 3 min easy jog between · 1.5 mi easy."},train:[],food:mealsTrain({hard:1})},
 {iso:"2026-10-22",type:"Easy",cal:"3 mi",mi:3,title:"Easy 3 + Strength B",run:{t:"Easy run · 3 mi",d:"9:45–10:30 /mi. Legs heavy? Swap for a 30 min walk."},train:[SB2],food:mealsTrain()},
 {iso:"2026-10-23",type:"Rest",cal:"Rest",title:"Rest day",run:null,train:[MOB,W(20)],food:mealsRest()},
 {iso:"2026-10-24",type:"Rest",cal:"Rest",title:"Rest day",run:null,train:[FR],food:mealsRest({extra:1}),note:"Extra carbs at lunch and dinner. Lay out tomorrow's kit and check your race start time to rehearse."},
 {iso:"2026-10-25",type:"Long run",key:1,cal:"Long 10",mi:10,title:"Long run 10",run:{t:"Long run · 10 mi",d:"Easy at 9:45–10:30 /mi; miles 6–8 at goal pace. Full dress rehearsal at your race start time."},train:[],food:mealsLong("Gel or 1½ tbsp honey at 40 min and 75 min, each with 150–250 ml water."),note:"Dress rehearsal: race shoes, socks, outfit, breakfast and fuel exactly as on race day."},
 {iso:"2026-10-26",type:"Rest",cal:"Rest",title:"Rest & recover",run:null,train:[W(30),{t:"Stretch routine · 10 min",d:ST.d},FR],food:mealsRest()},
 {iso:"2026-10-27",type:"Goal pace",key:1,cal:"5 mi",mi:5,title:"5 mi with 3 at GP",run:{t:"Goal-pace run · 5 mi",d:"1 mi easy · 3 mi at 9:20–9:30 /mi · 1 mi easy."},train:[],food:mealsTrain({hard:1}),note:"Taper week: less running, same eating. Fitness is banked."},
 {iso:"2026-10-28",type:"Easy",cal:"3 mi",mi:3,title:"Easy 3 + light strength",run:{t:"Easy run · 3 mi",d:"9:45–10:30 /mi."},train:[SL],food:mealsTrain()},
 {iso:"2026-10-29",type:"Easy",cal:"3 mi",mi:3,title:"Easy 3 + strides",run:{t:"Easy run · 3 mi",d:"9:45–10:30 /mi, then 4 × 20 s strides."},train:[],food:mealsTrain(),note:"Start lowering fibre: skip raspberries and fruit skins. No alcohol from today."},
 {iso:"2026-10-30",type:"Carb load",key:1,cal:"Rest",title:"Carb load day 1",run:null,train:[W(20),{t:"Lay out race kit",d:"Shoes, socks, outfit, cap, gels, anti-chafe, bib."}],food:mealsCarb(false),note:"About 600 g carbs today. Expect the scale to go up 1–2 kg — that's stored fuel."},
 {iso:"2026-10-31",type:"Carb load",key:1,cal:"Shake",mi:2,title:"Shakeout + carb load 2",run:{t:"Shakeout · 15–20 min",d:"Very easy, plus 3 strides. That's it."},train:[{t:"Pin bib, pack bag",d:"Confirm start time, transport and bib collection."},{t:"Legs up, early night",d:"Stay off your feet; in bed by 9:30 pm."}],food:mealsCarb(true),note:"Carb load day 2. Early, familiar dinner."},
 {iso:"2026-11-01",type:"Race day",key:1,race:1,cal:"RACE",mi:13.1,title:"Race day · 13.1",run:{t:"Sydney Half · 13.1 mi",d:"Miles 1–3 at 9:30–9:40 (it should feel too slow). Miles 4–10 at 9:20–9:30. Speed up only after mile 10 if you feel good."},train:[{t:"Warm-up · 20 min before start",d:"5 min walk, 3–4 min very easy jog, leg swings."},W(10)],food:mealsRace}
];
P.forEach(p=>{
  p.tasks=[];
  if(p.run){p.tasks.push({id:"r-wu",sec:"run",...WU},{id:"r-run",sec:"run",...p.run,main:1},{id:"r-st",sec:"run",...ST})}
  p.train.forEach((t,i)=>p.tasks.push({id:"t-"+i,sec:"train",...t}));
});
const byIso=Object.fromEntries(P.map(p=>[p.iso,p]));

/* ---------- state ---------- */
const state={};  // iso -> {c:{taskId:true}, miles, time, notes, updated}
let col=null, current=null;
const $=s=>document.querySelector(s);
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=k=>state[k]||(state[k]={c:{}});
function progress(p){const c=(state[p.iso]||{}).c||{};const n=p.tasks.filter(t=>c[t.id]).length;return{n,total:p.tasks.length,pct:p.tasks.length?n/p.tasks.length*100:0}}
const complete=p=>{const g=progress(p);return g.total>0&&g.n===g.total};
function parseTime(t){if(!t)return null;const a=String(t).trim().split(":").map(Number);if(!a.length||a.some(isNaN))return null;let s=0;for(const x of a)s=s*60+x;return a.length===1?s*60:s}
const fmt=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");

/* ---------- home ---------- */
function renderHome(){
  const t=parse(todayIso()),race=new Date(2026,10,1),dd=Math.round((race-t)/864e5);
  $("#hToday").textContent=`${DOWL[t.getDay()]} ${t.getDate()} ${MONL[t.getMonth()]}`;
  renderWeek();
  $("#hCount").textContent=dd>0?dd:(dd===0?"0":"✓");
  $("#hCountLbl").textContent=dd>1?"days until Sydney Half":dd===1?"day until Sydney Half":dd===0?"Race day! Go get it.":"Sydney Half done";
  // today card
  const tp=byIso[todayIso()]||(todayIso()<P[0].iso?P[0]:null);
  const card=$("#todayCard");
  if(tp){card.hidden=false;const g=progress(tp);
    $("#tcEyebrow").textContent=tp.iso===todayIso()?"Today's plan":"First day: "+DOW[parse(tp.iso).getDay()]+" "+parse(tp.iso).getDate()+" "+MON[parse(tp.iso).getMonth()];
    $("#tcTitle").textContent=tp.title;
    $("#tcSub").textContent=[tp.run?tp.run.t:"No run today",...tp.train.map(x=>x.t.split(" · ")[0])].join(" · ");
    $("#tcBar").style.width=g.pct+"%";$("#tcProg").textContent=complete(tp)?"Complete ✓":`${g.n} of ${g.total} done`;
    card.dataset.iso=tp.iso;card.querySelector(".open").textContent=complete(tp)?"Review day":"Open "+(tp.iso===todayIso()?"today":"day");
  } else card.hidden=true;
  // stats
  let days=0,miles=0;P.forEach(p=>{if(complete(p))days++;const s=state[p.iso]||{};const am=parseFloat(s.miles);if(!isNaN(am))miles+=am;else if(p.mi&&s.c&&s.c["r-run"])miles+=p.mi});
  let streak=0;for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.iso>todayIso())continue;if(complete(p))streak++;else if(p.iso===todayIso())continue;else break}
  $("#sDays").textContent=days+"/"+P.length;$("#sMiles").textContent=Math.round(miles*10)/10;$("#sStreak").textContent=streak;
  // calendar: Sun-start rows
  let h=DOW.map(d=>`<div class="dow">${d[0]}</div>`).join("");
  const labels=["Start","Week 1 · Build","Week 2 · Peak","Week 3 · Taper","Race week"];
  const start=parse(P[0].iso),end=parse(P[P.length-1].iso);
  let row=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(d.getDay()===0){const e=new Date(d);e.setDate(e.getDate()+6);const last=e>end?end:e;
      const lbl=["Build week","Peak week","Taper week","Race day"][row]||"";
      h+=`<div class="wk">${MON[d.getMonth()]} ${d.getDate()}${last>d?"–"+(last.getMonth()!==d.getMonth()?MON[last.getMonth()]+" ":"")+last.getDate():""} · ${lbl}</div>`;row++}
    const p=byIso[iso(d)];
    if(!p){h+=`<div class="cell empty"></div>`;continue}
    const g=progress(p),cls=["cell",p.mi?"run":"",p.key?"key":"",p.iso===todayIso()?"today":"",p.iso<todayIso()?"past":"",complete(p)?"complete":"",p.race&&!complete(p)?"race":""].join(" ");
    const showM=d.getDate()===1||p.iso===P[0].iso;
    h+=`<button type="button" class="${cls}" data-iso="${p.iso}" aria-label="${DOWL[d.getDay()]} ${d.getDate()} ${MONL[d.getMonth()]}: ${esc(p.title)}${complete(p)?", complete":g.n?`, ${g.n} of ${g.total} done`:""}">
      ${g.n&&!complete(p)?`<span class="ring" style="--p:${g.pct}"></span>`:""}
      <span class="m">${showM?MON[d.getMonth()]:"&nbsp;"}</span><span class="d">${d.getDate()}</span><span class="lab">${esc(p.cal)}</span></button>`;
    // pad end of the race week row
    if(p.race){for(let k=d.getDay()+1;k<7;k++)h+=`<div class="cell empty"></div>`}
  }
  $("#grid").innerHTML=h;
}

/* ---------- day ---------- */
let mealsOpen=false;
function renderFood(p){
  const f=p.food,grp=(h,items,timed)=>items&&items.length?`<div class="fgroup"><h3>${h}</h3>${items.map(x=>`<div class="fitem">${timed?`<span class="when">${esc(x.w)}</span>`:""}<div><div class="ft">${esc(x.t)}</div><div class="fd">${esc(x.d)}</div></div></div>`).join("")}</div>`:"";
  $("#secFood").querySelector("[data-list]").innerHTML=
    grp("Before training",f.pre,1)+grp("During",f.during,1)+grp("After training",f.post,1)+
    (f.meals&&f.meals.length?`<details class="fgroup mealsbox"${mealsOpen?" open":""}><summary><span>${p.race?"After the race":"Meal ideas"}</span><span class="cnt">${f.meals.length} ${f.meals.length===1?"idea":"ideas"}</span></summary>${f.meals.map(x=>`<div class="fitem"><div><div class="ft">${esc(x.t)}</div><div class="fd">${esc(x.d)}</div></div></div>`).join("")}</details>`:"")+
    (f.tips&&f.tips.length?`<div class="fgroup"><h3>Today's targets</h3><ul class="tips">${f.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:"");
}
function taskHTML(t,c){
  return `<button type="button" class="task" role="checkbox" aria-checked="${!!c[t.id]}" data-task="${t.id}">
    <span class="box" aria-hidden="true"></span>
    <span><span class="tt">${t.time?`<span class="time">${esc(t.time)}</span>`:""}<span>${esc(t.t)}</span></span>
    <span class="dd" style="display:block">${esc(t.d)}</span>
    ${t.l?`<ul>${t.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</span></button>`;
}
function renderDay(){
  const p=byIso[current];if(!p)return;const s=S(p.iso),d=parse(p.iso),g=progress(p),done=complete(p);
  $("#dBarTitle").textContent=`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  const rel=p.iso===todayIso()?`<span class="chip acc">Today</span>`:"";
  const daysTo=Math.round((new Date(2026,10,1)-d)/864e5);
  $("#dChips").innerHTML=`${rel}<span class="chip">${esc(p.type)}</span>${p.mi?`<span class="chip">${p.mi} mi planned</span>`:""}${daysTo>0?`<span class="chip">${daysTo} days to race</span>`:""}${done?`<span class="chip ok">Complete</span>`:""}`;
  $("#dTitle").textContent=TYPEL[p.type]||p.title;
  $("#dDate").textContent=`${DOWL[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`;
  $("#dKick").textContent=p.iso===todayIso()?"Today's plan":"The plan";
  $("#dSub").textContent=p.race?"13.1 miles":p.mi?(p.mi===2?"15–20 minutes":p.mi+" miles"):p.title;
  $("#dBar").style.width=g.pct+"%";$("#dProg").textContent=done?"All done — complete training day":`${g.n} of ${g.total} done`;
  const note=$("#dNote");note.hidden=!p.note;note.textContent=p.note||"";
  const sec=(id,key)=>{const el=$(id),items=p.tasks.filter(t=>t.sec===key);el.hidden=!items.length;if(!items.length)return;
    el.querySelector("[data-list]").innerHTML=items.map(t=>taskHTML(t,s.c)).join("");
    el.querySelector("[data-count]").textContent=`${items.filter(t=>s.c[t.id]).length}/${items.length}`};
  sec("#secRun","run");sec("#secTrain","train");renderFood(p);
  if(document.activeElement!==$("#logMiles"))$("#logMiles").value=s.miles||"";
  if(document.activeElement!==$("#logTime"))$("#logTime").value=s.time||"";
  if(document.activeElement!==$("#dayNotes"))$("#dayNotes").value=s.notes||"";
  $("#logMiles").placeholder=p.mi||"0";
  const m=parseFloat(s.miles),sec2=parseTime(s.time);
  $("#logPace").innerHTML=m>0&&sec2?`Average pace <b>${fmt(sec2/m)} /mi</b> · <b>${fmt(sec2/(m*1.609))} /km</b>`:"Log your miles and time to see your pace.";
  const i=P.indexOf(p);$("#prevDay").disabled=i===0;$("#nextDay").disabled=i===P.length-1;
  $("#todayBtn").hidden=!byIso[todayIso()]||p.iso===todayIso();
}
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function enter(){const el=document.querySelector(".screen:not([hidden])");if(!el||reduceMotion())return;el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter")}
let swapping=false;
function swap(fn){const cur=document.querySelector(".screen:not([hidden])");
  if(!cur||reduceMotion()){fn();return}
  if(swapping)return;swapping=true;
  cur.classList.remove("enter");void cur.offsetWidth;cur.classList.add("leaving");
  setTimeout(()=>{fn();cur.classList.remove("leaving");enter();swapping=false},220)}
function openDay(k){swap(()=>_openDay(k))}
function goHome(push){swap(()=>_goHome(push))}
function _openDay(k){current=k;$("#home").hidden=true;$("#day").hidden=false;renderDay();window.scrollTo(0,0);try{history.pushState({day:k},"")}catch(_){}}
function _goHome(push){current=null;$("#day").hidden=true;$("#home").hidden=false;renderHome();window.scrollTo(0,0)}
window.addEventListener("popstate",()=>{if(current)goHome()});

/* ---------- saving ---------- */
function saveLocal(){try{localStorage.setItem("half-log-v2",JSON.stringify(state))}catch(_){}}
const timers={};
function save(k){const s=S(k);s.updated=Date.now();saveLocal();
  if(!col){setSync("Saved on this phone");return}
  clearTimeout(timers[k]);timers[k]=setTimeout(async()=>{try{await col.doc(k).set(JSON.parse(JSON.stringify(state[k])));setSync("Saved to your account")}catch(e){setSync("Couldn't reach your account — saved on this device")}},400);
}
function setSync(t){$("#sync").textContent=t}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600)}

/* ---------- events ---------- */
$("#grid").addEventListener("click",e=>{const b=e.target.closest("button.cell");if(b)openDay(b.dataset.iso)});
$("#todayCard").addEventListener("click",()=>{const k=$("#todayCard").dataset.iso;if(k)openDay(k)});
$("#back").addEventListener("click",()=>{goHome()});
$("#todayBtn").addEventListener("click",()=>swap(()=>{current=todayIso();renderDay();window.scrollTo(0,0)}));
$("#prevDay").addEventListener("click",()=>{const i=P.findIndex(p=>p.iso===current);if(i>0)swap(()=>{current=P[i-1].iso;renderDay();window.scrollTo(0,0)})});
$("#nextDay").addEventListener("click",()=>{const i=P.findIndex(p=>p.iso===current);if(i<P.length-1)swap(()=>{current=P[i+1].iso;renderDay();window.scrollTo(0,0)})});
$("#day").addEventListener("click",e=>{
  const p=byIso[current];if(!p)return;const s=S(current),was=complete(p);
  const b=e.target.closest("[data-task]");if(!b)return;const id=b.dataset.task;
  const nc={...(s.c||{})};if(nc[id])delete nc[id];else nc[id]=true;s.c=nc;
  if(id==="r-run"&&s.c[id]&&!s.miles&&p.mi)s.miles=String(p.mi);
  renderDay();save(current);
  if(!was&&complete(p)){toast(p.race?"Half marathon done. Congratulations!":"Training day complete ✓");if(navigator.vibrate)try{navigator.vibrate(40)}catch(_){}}
});
["logMiles","logTime","dayNotes"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const f={logMiles:"miles",logTime:"time",dayNotes:"notes"}[id];S(current)[f]=e.target.value.trim();renderDay();save(current)}));


document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("mealsbox"))mealsOpen=e.target.open},true);

/* ---------- this week ---------- */
const TYPEL={"Easy":"Easy run","Tempo":"Tempo run","Goal pace":"Goal-pace run","Long run":"Long run","Rest":"Rest day","Strength":"Strength","Carb load":"Carb load","Race day":"Race day"};
function extraLabel(p){const t=p.train.map(x=>x.t);
  if(t.some(x=>/Strength|strength/.test(x)))return p.run?"+ Strength training":"+ Walk";
  if(t.some(x=>/mobility/i.test(x)))return "+ Hip mobility";
  if(p.run)return "+ Stretching";
  if(t.some(x=>/Walk/.test(x)))return "+ Walk";return ""}
function renderWeek(){
  if(!$("#strip"))return;
  const t=todayIso(),base=t<P[0].iso?parse(P[0].iso):parse(t);
  let strip="";
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(d.getDate()+i);const k=iso(d),p=byIso[k];
    strip+=`<div class="sd"><span class="sl">${DOW[d.getDay()]}</span>${p?`<button type="button" class="tile${k===t?" today":""}${complete(p)?" done":""}" data-iso="${k}" aria-label="${DOWL[d.getDay()]} ${d.getDate()}: ${esc(p.title)}">${d.getDate()}</button>`:`<span class="tile blank" aria-hidden="true"></span>`}</div>`}
  $("#strip").innerHTML=strip;
  const up=P.filter(p=>p.iso>t).slice(0,3);
  $("#wlist").innerHTML=up.length?up.map(p=>{const d=parse(p.iso);return `<button type="button" class="wcard glass${complete(p)?" isdone":""}" data-iso="${p.iso}">
    <span class="wd">${DOWL[d.getDay()]}</span>
    <span><span class="wt" style="display:block">${esc(TYPEL[p.type]||p.title)}</span><span class="wx" style="display:block">${esc(extraLabel(p))}</span></span>
    ${p.mi?`<span class="wm num">${p.race?"13.1":p.mi===2?"20":p.mi}<small>${p.mi===2?"min":"mi"}</small></span>`:`<span></span>`}</button>`}).join(""):"";
}
document.addEventListener("click",e=>{const b=e.target.closest("#strip [data-iso], #wlist [data-iso]");if(b)openDay(b.dataset.iso)});

/* ---------- boot ---------- */
try{const saved=JSON.parse(localStorage.getItem("half-log-v2")||"{}");Object.assign(state,saved)}catch(_){}
renderHome();enter();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{})})}
</script>
