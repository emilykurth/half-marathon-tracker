<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sydney Half Training Log</title>
<meta name="theme-color" content="#d27592">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Half Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
<style>
/* Layout: a rose-gradient phone app. Home = greeting + giant countdown, this-week strip and day cards, today card, stats, 22-day calendar. Day = sticky bar, centred plan header, glass checklist cards. */
:root{
  --top:#e5a2b8; --bottom:#c9506d; --white:#ffffff; --glass:rgba(255,255,255,.14); --glass-2:rgba(255,255,255,.24);
  --tile:#f9e8ed; --rose:#a3304e; --rose-mid:#c2546f; --line:rgba(255,255,255,.92); --muted:rgba(255,255,255,.84); --faint:rgba(255,255,255,.32);
  --font:"Ubuntu",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bottom);color:var(--white);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--top) 0%,var(--bottom) 100%)}
button{font-family:var(--font);color:inherit}
.screen{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
.screen[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.glass{background:var(--glass);border:2px solid var(--line);border-radius:12px}

/* home hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:8px 0}
.hero+.todaycard{margin-top:-4px}
.hello{font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.big{font-size:132px;font-weight:300;line-height:.95;letter-spacing:-.02em;margin-top:10px}
.bigl{font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.todayline{margin-top:14px;font-size:14px;color:var(--muted)}
.week{display:flex;flex-direction:column;gap:12px}
.week>p{margin:6px 0 2px;text-align:center;font-size:17px;letter-spacing:.02em}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip .sd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.strip .sl{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tile{width:100%;aspect-ratio:1/1;border-radius:9px;border:2px solid transparent;background:var(--tile);color:var(--rose);font-size:20px;font-weight:400;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.tile.today{border-color:var(--white);box-shadow:0 0 0 1px var(--rose-mid) inset}
.tile.done{background:var(--rose);color:var(--white)}
.tile.blank{background:var(--glass-2);cursor:default}
.wcard{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 12px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;color:var(--white)}
.wcard .wd{grid-column:1/-1;font-size:17px;font-weight:700}
.wcard .wt{font-size:30px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.wcard .wx{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-top:6px;color:var(--muted)}
.wcard .wm{font-size:64px;font-weight:300;line-height:.8;white-space:nowrap}
.wcard .wm small{font-size:34px;font-weight:400;margin-left:2px}
.wcard.isdone .wd::after{content:" · done";font-weight:400;color:var(--muted)}

/* today card + stats */
.todaycard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%;color:var(--white)}
.todaycard .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.todaycard h3{margin:0;font-size:28px;font-weight:700;line-height:1.05;text-transform:uppercase}
.todaycard p{margin:0;color:var(--muted);font-size:14px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;height:8px;border-radius:4px;background:var(--faint);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--white);width:0;transition:width .35s}
.open{align-self:flex-start;background:var(--white);color:var(--rose);border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px 12px;min-width:0;text-align:center}
.stat .num{font-size:34px;font-weight:300;line-height:1}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}

/* calendar */
.cal{padding:14px 12px 12px}
.cal-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.cal-head h2{margin:0;font-size:20px;font-weight:700;text-transform:uppercase}
.cal-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wk{grid-column:1/-1;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 2px 0}
.cell{position:relative;aspect-ratio:1/1.18;max-width:100%;border:2px solid transparent;background:var(--tile);color:var(--rose);border-radius:9px;padding:5px 3px 4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;cursor:pointer;min-width:0;transition:transform .12s}
.cell:active{transform:scale(.95)}
.cell .d{font-size:19px;font-weight:400;line-height:1}
.cell .m{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;line-height:1;opacity:.75}
.cell .lab{font-size:10px;font-weight:700;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;opacity:.85;text-transform:uppercase}
.cell.key{box-shadow:0 0 0 1.5px var(--rose-mid) inset}
.cell .ring{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--rose) calc(var(--p)*1%),var(--rose-mid) 0);opacity:.7}
.cell.today{border-color:var(--white);box-shadow:0 0 0 2px var(--white)}
.cell.past:not(.complete){opacity:.6}
.cell.complete{background:var(--rose);color:var(--white);opacity:1}
.cell.complete .ring{display:none}
.cell.complete::after{content:"";position:absolute;top:6px;right:5px;width:9px;height:5px;border-left:2px solid var(--white);border-bottom:2px solid var(--white);transform:rotate(-45deg)}
.cell.race{background:var(--white);color:var(--rose)}
.cell.empty{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:12px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;box-sizing:border-box}
.legend .lg-done{background:var(--rose);border:1.5px solid var(--white)}
.legend .lg-today{background:var(--tile);border:2px solid var(--white)}
.legend .lg-key{background:var(--tile);box-shadow:0 0 0 1.5px var(--rose-mid) inset}
.legend .lg-prog{border-radius:50%;background:conic-gradient(var(--white) 50%,var(--faint) 0)}
.sync{font-size:12px;color:var(--muted);text-align:center}

/* day */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:8px;background:rgba(229,162,184,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--faint)}
.iconbtn{border:2px solid var(--line);background:var(--glass);border-radius:999px;height:38px;min-width:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:14px;cursor:pointer;color:var(--white)}
.iconbtn:disabled{opacity:.35;cursor:default}
.topbar .t{flex:1;text-align:center;font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.ddate{font-size:38px;font-weight:700;line-height:1;text-transform:uppercase;text-wrap:balance}
.dayhero h1{margin:0;font-size:40px;font-weight:700;line-height:1;text-transform:uppercase;text-wrap:balance}
.dsub{font-size:30px;font-weight:400;line-height:1}
.dsub:empty{display:none}
.dayhero .prog{width:100%;font-size:14px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px;border-radius:999px;background:var(--glass-2);color:var(--white)}
.chip.acc{background:var(--white);color:var(--rose)}
.chip.ok{background:var(--rose);color:var(--white)}
.note{background:var(--glass-2);border-radius:12px;padding:12px 14px;font-size:14px}
.sec{background:var(--glass);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--faint)}
.sec-h h2{margin:0;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--faint);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:var(--white)}
.task:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;transition:background .15s;margin-top:1px}
.task[aria-checked="true"] .box{background:var(--white)}
.task[aria-checked="true"] .box::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--rose);border-bottom:2.5px solid var(--rose);transform:rotate(-45deg) translate(1px,-1px)}
.task .tt{font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.task .time{font-size:12px;font-weight:700}
.task .dd{font-size:14px;color:var(--muted);margin-top:2px}
.task ul{margin:6px 0 0;padding-left:16px;font-size:14px;color:var(--muted)}
.task ul li{margin:1px 0}
.task[aria-checked="true"] .tt span:not(.time){text-decoration:line-through;text-decoration-color:var(--muted);opacity:.85}
.log{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--faint)}
.log label,.notes label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500;min-width:0}
.log .pace{grid-column:1/-1;font-size:13px;color:var(--muted)}
.log .pace b{color:var(--white);font-variant-numeric:tabular-nums}
input,textarea{font:16px var(--font);color:var(--rose);background:var(--tile);border:2px solid transparent;border-radius:10px;padding:9px 10px;width:100%;box-sizing:border-box}
input::placeholder,textarea::placeholder{color:var(--rose-mid);opacity:.8}
input:focus,textarea:focus{border-color:var(--white);outline:none}
textarea{min-height:72px;resize:vertical}
.notes{padding:12px 14px}
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daynav .iconbtn{height:46px}
.allbtn{border:0;background:none;color:var(--white);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.fgroup{padding:12px 14px;border-bottom:1px solid var(--faint);display:flex;flex-direction:column;gap:10px}
.fgroup:last-child{border-bottom:0}
.fgroup h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--white)}
.fitem{display:flex;flex-direction:column;gap:3px}
.fitem .when{align-self:flex-start;font-size:11px;font-weight:700;color:var(--rose);background:var(--white);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.fitem .ft{font-weight:700}
.fitem .fd{font-size:14px;color:var(--muted)}
.tips{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mealsbox summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--white);padding:2px 0}
.mealsbox summary::-webkit-details-marker{display:none}
.mealsbox summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
.mealsbox[open] summary::before{transform:rotate(45deg)}
.mealsbox summary .cnt{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);font-weight:400}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--white);color:var(--rose);padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:0 8px 28px rgba(120,20,50,.28);transition:transform .3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:370px){.big{font-size:110px}.wcard .wt{font-size:24px}.wcard .wm{font-size:52px}.cell .lab{font-size:9px}.cell .d{font-size:17px}.tile{font-size:17px}}

/* ---- readability layer: solid light cards with dark plum text; white text only on the gradient ---- */
:root{--top:#d27592;--bottom:#b23b5a;--card:#fffafb;--ink:#3b1220;--ink-muted:#6f3f50;--tint:#fbe5ec;--hair:rgba(163,48,78,.16);--rose:#a3304e;--rose-mid:#c2546f;--tile:#fbe5ec}
body{font-size:16px}
.glass,.sec,.note{--white:var(--ink);--muted:var(--ink-muted);--faint:var(--hair);--line:transparent;background:var(--card);color:var(--ink);border:0;box-shadow:0 6px 22px rgba(110,20,45,.16)}
.todaycard,.wcard,.task{color:var(--ink)}
.todaycard .eyebrow{color:var(--rose);font-weight:700}
.todaycard h3,.cal-head h2,.sec-h h2{color:var(--rose)}
.todaycard p,.task .dd,.fitem .fd,.tips,.task ul{font-size:15px}
.open,.send{background:var(--rose);color:#fff}
.prog .bar i{background:var(--rose)}
.dayhero .prog .bar{background:rgba(255,255,255,.35)}
.dayhero .prog .bar i{background:#fff}
.dayhero .prog{color:#fff}
.stat .num{color:var(--rose);font-weight:400}
.box{border-color:var(--rose)}
.task[aria-checked="true"] .box{background:var(--rose)}
.task[aria-checked="true"] .box::after{border-color:#fff}
.task .time{color:var(--rose)}
.fgroup h3,.mealsbox summary{color:var(--rose)}
.fitem .when{background:var(--rose);color:#fff}
.log .pace b{color:var(--ink)}
input,textarea{color:var(--ink);background:var(--tint);border:2px solid transparent}
input::placeholder,textarea::placeholder{color:var(--ink-muted);opacity:.75}
input:focus,textarea:focus{border-color:var(--rose)}
.cell{background:var(--tint);color:var(--rose)}
.cell.today{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.cell.complete{background:var(--rose);color:#fff}
.cell.complete::after{border-color:#fff}
.cell.race{background:var(--rose-mid);color:#fff}
.legend .lg-done{background:var(--rose);border:0}
.legend .lg-today{background:var(--tint);border:2px solid var(--rose)}
.legend .lg-key{background:var(--tint)}
.legend .lg-prog{background:conic-gradient(var(--rose) 50%,var(--hair) 0)}
.note{font-size:15px;border-left:4px solid var(--rose)}
.chip{background:rgba(255,255,255,.22)}
.chip.acc{background:#fff;color:var(--rose)}
.chip.ok{background:#fff;color:var(--rose)}
.iconbtn{background:var(--card);color:var(--rose);border:0;font-weight:700;box-shadow:0 3px 12px rgba(110,20,45,.14)}
.topbar{background:rgba(210,117,146,.94)}
.topbar .t{color:#fff;font-weight:700}
.hello,.bigl{font-weight:500}
.todayline{color:#fff;font-size:16px;font-weight:500}
.kick{color:#fff;font-weight:500}
.sync{color:#fff;opacity:.9}
.toast{background:var(--card);color:var(--rose)}

/* standalone app shell */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior-y:none}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--top);z-index:30;pointer-events:none}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<!-- HOME -->
<div class="screen" id="home">
  <header class="hero">
    <div class="hello" id="hello">Hello Emily</div>
    <div class="big num" id="hCount">–</div>
    <div class="bigl" id="hCountLbl">days left</div>
    <div class="todayline" id="hToday"></div>
  </header>

  <button type="button" class="todaycard glass" id="todayCard">
    <span class="eyebrow" id="tcEyebrow">Today's plan</span>
    <h3 id="tcTitle">–</h3>
    <p id="tcSub"></p>
    <div class="prog"><div class="bar"><i id="tcBar"></i></div><span id="tcProg">0 of 0</span></div>
    <span class="open">Open today</span>
  </button>

  <section class="stats" aria-label="Progress">
    <div class="stat glass"><div class="num" id="sDays">0</div><div class="lbl">Days complete</div></div>
    <div class="stat glass"><div class="num" id="sMiles">0</div><div class="lbl">Miles run</div></div>
    <div class="stat glass"><div class="num" id="sStreak">0</div><div class="lbl">Day streak</div></div>
  </section>

  <section class="cal glass" aria-label="Training calendar">
    <div class="cal-head"><h2>Training block</h2><span>Oct 11 – Nov 1</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="lg-done"></i>Complete</span>
      <span><i class="lg-today"></i>Today</span>
      <span><i class="lg-key"></i>Key session</span>
    </div>
  </section>
  <div class="sync" id="sync">Saved on this phone</div>
</div>

<!-- DAY -->
<div class="screen" id="day" hidden>
  <div class="topbar">
    <button type="button" class="iconbtn" id="back" aria-label="Back to calendar">‹ Calendar</button>
    <div class="t" id="dBarTitle"></div>
    <button type="button" class="iconbtn" id="todayBtn">Today</button>
  </div>
  <div class="dayhero">
    <div class="chips" id="dChips"></div>
    <div class="ddate" id="dDate"></div><div class="kick" id="dKick">Today's plan</div><h1 id="dTitle"></h1><div class="dsub num" id="dSub"></div>
    <div class="prog"><div class="bar"><i id="dBar"></i></div><span id="dProg"></span></div>
  </div>
  <div class="note" id="dNote" hidden></div>
  <section class="sec" id="secRun"><div class="sec-h"><h2>Run</h2><span data-count></span></div><div data-list></div>
    <div class="log" id="runLog">
      <label for="logMiles">Actual miles<input id="logMiles" inputmode="decimal" placeholder="0"></label>
      <label for="logTime">Time (h:mm:ss)<input id="logTime" inputmode="numeric" placeholder="e.g. 48:30"></label>
      <div class="pace" id="logPace"></div>
    </div>
  </section>
  <section class="sec" id="secTrain"><div class="sec-h"><h2>Training &amp; mobility</h2><span data-count></span></div><div data-list></div></section>
  <section class="sec" id="secFood"><div class="sec-h"><h2>Nutrition</h2><span>Suggestions</span></div><div data-list></div></section>
  <section class="sec"><div class="sec-h"><h2>Notes</h2></div>
    <div class="notes"><label for="dayNotes">How it went<textarea id="dayNotes" placeholder="Energy, aches, weather, what you ate instead…"></textarea></label></div>
  </section>
  <div class="daynav"><button type="button" class="iconbtn" id="prevDay">‹ Previous day</button><button type="button" class="iconbtn" id="nextDay">Next day ›</button></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- building blocks ---------- */
const WU={t:"Warm-up · 5 min",d:"Brisk walk 2 min, leg swings 10 each leg, 10 walking lunges, high knees + butt kicks 20 m, ankle circles."};
const ST={t:"Post-run stretch · 10 min",d:"Calves, hamstrings, quads, hip flexors, glutes. Hold 30–45 s each side."};
const SA={t:"Strength A · 35 min",d:"3 sets each, 60–90 s rest. Weights you could lift 2–3 more reps with.",l:["Goblet squat × 10","Romanian deadlift × 10","Reverse lunge × 8 each leg","Calf raise on a step × 15 (3 s down)","Glute bridge × 12 (2 s hold)","Plank 40 s"]};

P.forEach(p=>{
  p.tasks=[];
  if(p.run){p.tasks.push({id:"r-wu",sec:"run",...WU},{id:"r-run",sec:"run",...p.run,main:1},{id:"r-st",sec:"run",...ST})}
  p.train.forEach((t,i)=>p.tasks.push({id:"t-"+i,sec:"train",...t}));
});
const byIso=Object.fromEntries(P.map(p=>[p.iso,p]));

/* ---------- state ---------- */
const state={};  // iso -> {c:{taskId:true}, miles, time, notes, updated}
let col=null, current=null;
const $=s=>document.querySelector(s);
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=k=>state[k]||(state[k]={c:{}});
function progress(p){const c=(state[p.iso]||{}).c||{};const n=p.tasks.filter(t=>c[t.id]).length;return{n,total:p.tasks.length,pct:p.tasks.length?n/p.tasks.length*100:0}}
const complete=p=>{const g=progress(p);return g.total>0&&g.n===g.total};
function parseTime(t){if(!t)return null;const a=String(t).trim().split(":").map(Number);if(!a.length||a.some(isNaN))return null;let s=0;for(const x of a)s=s*60+x;return a.length===1?s*60:s}
const fmt=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");

/* ---------- home ---------- */
function renderHome(){
  const t=parse(todayIso()),race=new Date(2026,10,1),dd=Math.round((race-t)/864e5);
  $("#hToday").textContent=`${DOWL[t.getDay()]} ${t.getDate()} ${MONL[t.getMonth()]} ${t.getFullYear()}`;
  renderWeek();
  $("#hCount").textContent=dd>0?dd:(dd===0?"0":"✓");
  $("#hCountLbl").textContent=dd>1?"days left":dd===1?"day left":dd===0?"race day!":"race done";
  // today card
  const tp=byIso[todayIso()]||(todayIso()<P[0].iso?P[0]:null);
  const card=$("#todayCard");
  if(tp){card.hidden=false;const g=progress(tp);
    $("#tcEyebrow").textContent=tp.iso===todayIso()?"Today's plan":"First day: "+DOW[parse(tp.iso).getDay()]+" "+parse(tp.iso).getDate()+" "+MON[parse(tp.iso).getMonth()];
    $("#tcTitle").textContent=tp.title;
    $("#tcSub").textContent=[tp.run?tp.run.t:"No run today",...tp.train.map(x=>x.t.split(" · ")[0])].join(" · ");
    $("#tcBar").style.width=g.pct+"%";$("#tcProg").textContent=complete(tp)?"Complete ✓":`${g.n} of ${g.total} done`;
    card.dataset.iso=tp.iso;card.querySelector(".open").textContent=complete(tp)?"Review day":"Open "+(tp.iso===todayIso()?"today":"day");
  } else card.hidden=true;
  // stats
  let days=0,miles=0;P.forEach(p=>{if(complete(p))days++;const s=state[p.iso]||{};const am=parseFloat(s.miles);if(!isNaN(am))miles+=am;else if(p.mi&&s.c&&s.c["r-run"])miles+=p.mi});
  let streak=0;for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.iso>todayIso())continue;if(complete(p))streak++;else if(p.iso===todayIso())continue;else break}
  $("#sDays").textContent=days+"/"+P.length;$("#sMiles").textContent=Math.round(miles*10)/10;$("#sStreak").textContent=streak;
  // calendar: Sun-start rows
  let h=DOW.map(d=>`<div class="dow">${d[0]}</div>`).join("");
  const labels=["Start","Week 1 · Build","Week 2 · Peak","Week 3 · Taper","Race week"];
  const start=parse(P[0].iso),end=parse(P[P.length-1].iso);
  let row=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(d.getDay()===0){const e=new Date(d);e.setDate(e.getDate()+6);const last=e>end?end:e;
      const lbl=["Build week","Peak week","Taper week","Race day"][row]||"";
      h+=`<div class="wk">${MON[d.getMonth()]} ${d.getDate()}${last>d?"–"+(last.getMonth()!==d.getMonth()?MON[last.getMonth()]+" ":"")+last.getDate():""} · ${lbl}</div>`;row++}
    const p=byIso[iso(d)];
    if(!p){h+=`<div class="cell empty"></div>`;continue}
    const g=progress(p),cls=["cell",p.mi?"run":"",p.key?"key":"",p.iso===todayIso()?"today":"",p.iso<todayIso()?"past":"",complete(p)?"complete":"",p.race&&!complete(p)?"race":""].join(" ");
    const showM=d.getDate()===1||p.iso===P[0].iso;
    h+=`<button type="button" class="${cls}" data-iso="${p.iso}" aria-label="${DOWL[d.getDay()]} ${d.getDate()} ${MONL[d.getMonth()]}: ${esc(p.title)}${complete(p)?", complete":g.n?`, ${g.n} of ${g.total} done`:""}">
      ${g.n&&!complete(p)?`<span class="ring" style="--p:${g.pct}"></span>`:""}
      <span class="m">${showM?MON[d.getMonth()]:"&nbsp;"}</span><span class="d">${d.getDate()}</span><span class="lab">${esc(p.cal)}</span></button>`;
    // pad end of the race week row
    if(p.race){for(let k=d.getDay()+1;k<7;k++)h+=`<div class="cell empty"></div>`}
  }
  $("#grid").innerHTML=h;
}

/* ---------- day ---------- */
let mealsOpen=false;
function renderFood(p){
  const f=p.food,grp=(h,items,timed)=>items&&items.length?`<div class="fgroup"><h3>${h}</h3>${items.map(x=>`<div class="fitem">${timed?`<span class="when">${esc(x.w)}</span>`:""}<div><div class="ft">${esc(x.t)}</div><div class="fd">${esc(x.d)}</div></div></div>`).join("")}</div>`:"";
  $("#secFood").querySelector("[data-list]").innerHTML=
    grp("Before training",f.pre,1)+grp("During",f.during,1)+grp("After training",f.post,1)+
    (f.meals&&f.meals.length?`<details class="fgroup mealsbox"${mealsOpen?" open":""}><summary><span>${p.race?"After the race":"Meal ideas"}</span><span class="cnt">${f.meals.length} ${f.meals.length===1?"idea":"ideas"}</span></summary>${f.meals.map(x=>`<div class="fitem"><div><div class="ft">${esc(x.t)}</div><div class="fd">${esc(x.d)}</div></div></div>`).join("")}</details>`:"")+
    (f.tips&&f.tips.length?`<div class="fgroup"><h3>Today's targets</h3><ul class="tips">${f.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:"");
}
function taskHTML(t,c){
  return `<button type="button" class="task" role="checkbox" aria-checked="${!!c[t.id]}" data-task="${t.id}">
    <span class="box" aria-hidden="true"></span>
    <span><span class="tt">${t.time?`<span class="time">${esc(t.time)}</span>`:""}<span>${esc(t.t)}</span></span>
    <span class="dd" style="display:block">${esc(t.d)}</span>
    ${t.l?`<ul>${t.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</span></button>`;
}
function renderDay(){
  const p=byIso[current];if(!p)return;const s=S(p.iso),d=parse(p.iso),g=progress(p),done=complete(p);
  $("#dBarTitle").textContent=`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  const rel=p.iso===todayIso()?`<span class="chip acc">Today</span>`:"";
  const daysTo=Math.round((new Date(2026,10,1)-d)/864e5);
  $("#dChips").innerHTML=`${rel}<span class="chip">${esc(p.type)}</span>${p.mi?`<span class="chip">${p.mi} mi planned</span>`:""}${daysTo>0?`<span class="chip">${daysTo} days to race</span>`:""}${done?`<span class="chip ok">Complete</span>`:""}`;
  $("#dTitle").textContent=TYPEL[p.type]||p.title;
  $("#dDate").textContent=`${DOWL[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`;
  $("#dKick").textContent=p.iso===todayIso()?"Today's plan":"The plan";
  $("#dSub").textContent=p.race?"13.1 miles":p.mi?(p.mi===2?"15–20 minutes":p.mi+" miles"):p.title;
  $("#dBar").style.width=g.pct+"%";$("#dProg").textContent=done?"All done — complete training day":`${g.n} of ${g.total} done`;
  const note=$("#dNote");note.hidden=!p.note;note.textContent=p.note||"";
  const sec=(id,key)=>{const el=$(id),items=p.tasks.filter(t=>t.sec===key);el.hidden=!items.length;if(!items.length)return;
    el.querySelector("[data-list]").innerHTML=items.map(t=>taskHTML(t,s.c)).join("");
    el.querySelector("[data-count]").textContent=`${items.filter(t=>s.c[t.id]).length}/${items.length}`};
  sec("#secRun","run");sec("#secTrain","train");renderFood(p);
  if(document.activeElement!==$("#logMiles"))$("#logMiles").value=s.miles||"";
  if(document.activeElement!==$("#logTime"))$("#logTime").value=s.time||"";
  if(document.activeElement!==$("#dayNotes"))$("#dayNotes").value=s.notes||"";
  $("#logMiles").placeholder=p.mi||"0";
  const m=parseFloat(s.miles),sec2=parseTime(s.time);
  $("#logPace").innerHTML=m>0&&sec2?`Average pace <b>${fmt(sec2/m)} /mi</b> · <b>${fmt(sec2/(m*1.609))} /km</b>`:"Log your miles and time to see your pace.";
  const i=P.indexOf(p);$("#prevDay").disabled=i===0;$("#nextDay").disabled=i===P.length-1;
  $("#todayBtn").hidden=!byIso[todayIso()]||p.iso===todayIso();
}
function openDay(k){current=k;$("#home").hidden=true;$("#day").hidden=false;renderDay();window.scrollTo(0,0);try{history.pushState({day:k},"")}catch(_){}}
function goHome(push){current=null;$("#day").hidden=true;$("#home").hidden=false;renderHome();window.scrollTo(0,0)}
window.addEventListener("popstate",()=>{if(current)goHome()});

/* ---------- saving ---------- */
function saveLocal(){try{localStorage.setItem("half-log-v2",JSON.stringify(state))}catch(_){}}
const timers={};
function save(k){const s=S(k);s.updated=Date.now();saveLocal();
  if(!col){setSync("Saved on this phone");return}
  clearTimeout(timers[k]);timers[k]=setTimeout(async()=>{try{await col.doc(k).set(JSON.parse(JSON.stringify(state[k])));setSync("Saved to your account")}catch(e){setSync("Couldn't reach your account — saved on this device")}},400);
}
function setSync(t){$("#sync").textContent=t}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600)}

/* ---------- events ---------- */
$("#grid").addEventListener("click",e=>{const b=e.target.closest("button.cell");if(b)openDay(b.dataset.iso)});
$("#todayCard").addEventListener("click",()=>{const k=$("#todayCard").dataset.iso;if(k)openDay(k)});
$("#back").addEventListener("click",()=>{goHome()});
$("#todayBtn").addEventListener("click",()=>{current=todayIso();renderDay();window.scrollTo(0,0)});
$("#prevDay").addEventListener("click",()=>{const i=P.findIndex(p=>p.iso===current);if(i>0){current=P[i-1].iso;renderDay();window.scrollTo(0,0)}});
$("#nextDay").addEventListener("click",()=>{const i=P.findIndex(p=>p.iso===current);if(i<P.length-1){current=P[i+1].iso;renderDay();window.scrollTo(0,0)}});
$("#day").addEventListener("click",e=>{
  const p=byIso[current];if(!p)return;const s=S(current),was=complete(p);
  const b=e.target.closest("[data-task]");if(!b)return;const id=b.dataset.task;
  const nc={...(s.c||{})};if(nc[id])delete nc[id];else nc[id]=true;s.c=nc;
  if(id==="r-run"&&s.c[id]&&!s.miles&&p.mi)s.miles=String(p.mi);
  renderDay();save(current);
  if(!was&&complete(p)){toast(p.race?"Half marathon done. Congratulations!":"Training day complete ✓");if(navigator.vibrate)try{navigator.vibrate(40)}catch(_){}}
});
["logMiles","logTime","dayNotes"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const f={logMiles:"miles",logTime:"time",dayNotes:"notes"}[id];S(current)[f]=e.target.value.trim();renderDay();save(current)}));


document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("mealsbox"))mealsOpen=e.target.open},true);

/* ---------- this week ---------- */
const TYPEL={"Easy":"Easy run","Tempo":"Tempo run","Goal pace":"Goal-pace run","Long run":"Long run","Rest":"Rest day","Strength":"Strength","Carb load":"Carb load","Race day":"Race day"};
function extraLabel(p){const t=p.train.map(x=>x.t);
  if(t.some(x=>/Strength|strength/.test(x)))return p.run?"+ Strength training":"+ Walk";
  if(t.some(x=>/mobility/i.test(x)))return "+ Hip mobility";
  if(p.run)return "+ Stretching";
  if(t.some(x=>/Walk/.test(x)))return "+ Walk";return ""}
function renderWeek(){
  if(!$("#strip"))return;
  const t=todayIso(),base=t<P[0].iso?parse(P[0].iso):parse(t);
  let strip="";
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(d.getDate()+i);const k=iso(d),p=byIso[k];
    strip+=`<div class="sd"><span class="sl">${DOW[d.getDay()]}</span>${p?`<button type="button" class="tile${k===t?" today":""}${complete(p)?" done":""}" data-iso="${k}" aria-label="${DOWL[d.getDay()]} ${d.getDate()}: ${esc(p.title)}">${d.getDate()}</button>`:`<span class="tile blank" aria-hidden="true"></span>`}</div>`}
  $("#strip").innerHTML=strip;
  const up=P.filter(p=>p.iso>t).slice(0,3);
  $("#wlist").innerHTML=up.length?up.map(p=>{const d=parse(p.iso);return `<button type="button" class="wcard glass${complete(p)?" isdone":""}" data-iso="${p.iso}">
    <span class="wd">${DOWL[d.getDay()]}</span>
    <span><span class="wt" style="display:block">${esc(TYPEL[p.type]||p.title)}</span><span class="wx" style="display:block">${esc(extraLabel(p))}</span></span>
    ${p.mi?`<span class="wm num">${p.race?"13.1":p.mi===2?"20":p.mi}<small>${p.mi===2?"min":"mi"}</small></span>`:`<span></span>`}</button>`}).join(""):"";
}
document.addEventListener("click",e=>{const b=e.target.closest("#strip [data-iso], #wlist [data-iso]");if(b)openDay(b.dataset.iso)});

/* ---------- boot ---------- */
try{const saved=JSON.parse(localStorage.getItem("half-log-v2")||"{}");Object.assign(state,saved)}catch(_){}
renderHome();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
